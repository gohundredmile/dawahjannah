name: Build & Release APK (OTA Engine)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Optional Release Title'
        required: false
        default: ''
      release_notes:
        description: 'Optional Release Notes'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish to GitHub Releases
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "Setting up Android SDK environment..."
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n8933bad161af4b78b1149d4f0237c49b11fb1113\nd56f5187479451eabf01fb78ba6ed6ee79dd4335\n24333f8a63b1d99d69ac822aab864e9e37635897\n84831b9409646a7f841b3a7c804e447fb32404b5\n" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf "\n84831b9409646a7f841b3a7c804e447fb32404b5\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi

      - name: Prepare Signing Keystore & Build Environment
        run: |
          echo "Setting up build environment..."
          # Ensure .env is populated with safe defaults so BuildConfig generation never breaks
          if [ ! -s .env ]; then
            echo "GEMINI_API_KEY=\"your_api_key_here\"" > .env
          fi
          # Ensure both .env and .env.example never contain empty assignments that cause javac syntax errors
          for f in .env .env.example; do
            if [ -f "$f" ]; then
              sed -i 's/^GEMINI_API_KEY=$/GEMINI_API_KEY="your_api_key_here"/' "$f" || true
              sed -i 's/^GEMINI_API_KEY=""$/GEMINI_API_KEY="your_api_key_here"/' "$f" || true
              sed -i "s/^GEMINI_API_KEY=''$/GEMINI_API_KEY=\"your_api_key_here\"/" "$f" || true
            fi
          done

          echo "Setting up persistent signing keystore..."
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using RELEASE_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "Using SIGNING_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding local debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore..."
          else
            echo "Decoding unified persistent project signing keystore..."
            printf '%s' "" | base64 -d > debug.keystore
          fi

          # Clean up any stale release.keystore so signingConfig uses the unified debug.keystore
          rm -f release.keystore 2>/dev/null || true
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          chmod +x gradlew build_release.sh || true

      - name: Build Android APK with Gradle
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Stage APK Artifacts
        run: |
          mkdir -p release_artifacts
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            echo "Found release APK: $RELEASE_APK"
            cp "$RELEASE_APK" release_artifacts/app-release.apk
          else
            FALLBACK_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$FALLBACK_APK" release_artifacts/app-release.apk
          fi
          if [ -n "$DEBUG_APK" ]; then
            echo "Found debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" release_artifacts/app-debug.apk
          else
            cp release_artifacts/app-release.apk release_artifacts/app-debug.apk
          fi

          # Ensure both artifacts are verified and properly signed
          if [ -f "debug.keystore" ]; then
            APKSIGNER_BIN=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -n 1)
            if [ -n "$APKSIGNER_BIN" ]; then
              for apk in release_artifacts/app-release.apk release_artifacts/app-debug.apk; do
                if [ -f "$apk" ]; then
                  if ! "$APKSIGNER_BIN" verify "$apk" 2>/dev/null; then
                    echo "Artifact $apk was unsigned or failed verification. Signing with debug.keystore..."
                    "$APKSIGNER_BIN" sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$apk" || true
                  fi
                fi
              done
            fi
          fi

          ls -lh release_artifacts/

      - name: Extract Version Info
        id: get_version
        run: |
          VER_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VER_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*([0-9]+).*/\1/')
          if [ -z "$VER_NAME" ]; then
            VER_NAME="1.5.0"
          fi
          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v${VER_NAME}" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VER_NAME ($VER_CODE)"

      - name: Upload APK as Workflow Artifact (Always Accessible)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: release_artifacts/app-release.apk
          retention-days: 90

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        id: create_release
        continue-on-error: true
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: ${{ inputs.release_title || format('দাওয়া টু জান্নাহ - সংস্করণ {0}', steps.get_version.outputs.version_name) }}
          body: ${{ inputs.release_notes || 'স্বয়ংক্রিয়ভাবে বিল্ডকৃত নতুন রিলিজ APK। ফোনের সেটিংস থেকে সম্পূর্ণ APK ওটিএ অটো-আপডেট বাটনে চাপ দিলে সরাসরি এটি ফোনে ডাউনলোড ও ইনস্টল হবে।' }}
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            release_artifacts/app-release.apk
            release_artifacts/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback CLI Release & Latest Tag Mirroring
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ steps.get_version.outputs.tag_name }}
          VER_NAME: ${{ steps.get_version.outputs.version_name }}
          INPUT_TITLE: ${{ inputs.release_title }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set +e
          TITLE="$INPUT_TITLE"
          if [ -z "$TITLE" ]; then
            TITLE="দাওয়া টু জান্নাহ - সংস্করণ ${VER_NAME}"
          fi
          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ]; then
            NOTES="স্বয়ংক্রিয়ভাবে বিল্ডকৃত নতুন রিলিজ APK। ফোনের সেটিংস থেকে ওটিএ অটো-আপডেট বাটনে চাপ দিলে সরাসরি এটি ফোনে ইনস্টল হবে।"
          fi

          echo "Ensuring release assets are present for tag: $TAG_VERSION..."
          gh release upload "$TAG_VERSION" release_artifacts/app-release.apk release_artifacts/app-debug.apk --clobber 2>/dev/null || \
            gh release create "$TAG_VERSION" release_artifacts/app-release.apk release_artifacts/app-debug.apk \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" 2>/dev/null || true

          # Also maintain 'latest' tag for direct backward-compatibility
          gh release upload "latest" release_artifacts/app-release.apk release_artifacts/app-debug.apk --clobber 2>/dev/null || \
            gh release create "latest" release_artifacts/app-release.apk release_artifacts/app-debug.apk \
              --title "Dawah to Jannah - Latest Release" \
              --notes "সর্বশেষ স্বয়ংক্রিয় রিলিজ APK (Auto-built on push/dispatch)." \
              --target "${{ github.sha }}" 2>/dev/null || true

          echo "GitHub Release pipeline complete!"
